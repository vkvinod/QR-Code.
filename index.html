<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఉచిత QR కోడ్ జెనరేటర్</title>
    <!-- Tailwind CSS for modern design -->
    <script src="https://jsdelivr.net"></script>
    <!-- Open source QR Code Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-100 flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Free QR Code Generator</h1>
        <p class="text-slate-500 text-sm mb-6">మీ లింక్ లేదా టెక్స్ట్‌ను ఇక్కడ ఎంటర్ చేసి QR కోడ్ పొందండి</p>
        
        <input type="text" id="qr-text" placeholder="https://example.com లేదా ఏదైనా టెక్స్ట్..." 
            class="w-full p-3 border border-slate-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700">
        
        <button onclick="generateQR()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-xl transition duration-200 cursor-pointer">
            QR కోడ్ తయారు చేయి
        </button>

        <!-- QR Code Display Area -->
        <div id="qrcode" class="mt-8 flex justify-center p-4 bg-slate-50 rounded-xl border border-slate-100 hidden"></div>
    </div>

    <script>
        let qrcodeContainer = document.getElementById("qrcode");
        let qrcode = new QRCode(qrcodeContainer, {
            width: 200,
            height: 200
        });

        function generateQR() {
            let text = document.getElementById("qr-text").value.trim();
            
            if (text === "") {
                alert("దయచేసి ఏదైనా లింక్ లేదా టెక్స్ట్ ఎంటర్ చేయండి!");
                return;
            }

            qrcodeContainer.classList.remove("hidden");
            qrcode.clear(); 
            qrcode.makeCode(text);
        }
    </script>

</body>
</html>
